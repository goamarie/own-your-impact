# Anonymous usage counters: each path below shows up as a page hit in Netlify's analytics.
[[redirects]]
  from = "/get/guide"
  to = "/Own-Your-Impact-Guide.pdf"
  status = 302

[[redirects]]
  from = "/get/folder"
  to = "/My-Career-Brain.zip"
  status = 302

[[redirects]]
  from = "/t/*"
  to = "/t.txt"
  status = 200

# Keep repo-only files off the public site (they stay visible on GitHub).
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
