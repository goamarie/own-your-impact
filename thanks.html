<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Thank You</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..800,0..100&family=Figtree:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light only;--paper:#FBF6EE;--ink:#2A1F1A;--ink-muted:#6B5B50;--rust:#B4532A;--on-rust:#FFFDF8;--pen:#2F4FD0;--heart:#7A2A2A;--glow-peach:#F6A55B;--glow-pink:#F3B8DC;--glow-aqua:#9FE3EC}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center;font:17px/28px "Figtree",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(50% 50% at 30% 35%,var(--glow-peach) 0%,transparent 70%),radial-gradient(45% 50% at 70% 50%,var(--glow-pink) 0%,transparent 70%),radial-gradient(50% 45% at 50% 90%,var(--glow-aqua) 0%,transparent 70%),var(--paper)}
  h1{font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 100;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.02em;color:var(--rust);margin:0 0 16px}
  p{color:var(--ink-muted);max-width:460px;margin:0 auto 24px}
  .sig{font-family:"Caveat",cursive;font-size:32px;font-weight:600;color:var(--heart);margin:0 0 28px}
  a{display:inline-block;font-weight:600;padding:12px 24px;border-radius:14px;background:var(--rust);color:var(--on-rust);text-decoration:none;box-shadow:2px 3px 0 rgba(42,31,26,0.18)}
  a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
</style>
</head>
<body>
  <div>
    <h1>Thank you.</h1>
    <p>Got it. Now go update your career record. You've done more than you think.</p>
    <p class="sig">AnneMarie</p>
    <a href="/">Back to the kit</a>
  </div>
</body>
</html>
